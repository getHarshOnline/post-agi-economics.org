<svg xmlns="http://www.w3.org/2000/svg" width="420" height="690" viewBox="0 0 420 690" role="img" aria-labelledby="plot-title plot-desc">
<title id="plot-title">Calibration and forecast resolution</title><desc id="plot-desc">Five forecasts at 0.2 include one event; five at 0.8 include four. A constant 0.5 matches the total five events in ten cases. Varying forecasts have mean Brier loss 0.16; constant forecasts 0.25.</desc>
<text x="20.000" y="28.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="start">Observed event frequency</text>
<path d="M80 85V330H390" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1.5"/>
<path d="M80 330L380 90" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1" stroke-dasharray="2 5"/>
<path d="M74 330.000H80 M80.000 330V336" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1.5"/>
<text x="65.000" y="337.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="end">0</text>
<text x="80.000" y="366.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="middle">0</text>
<path d="M74 210.000H80 M230.000 330V336" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1.5"/>
<text x="65.000" y="217.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="end">0.5</text>
<text x="230.000" y="366.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="middle">0.5</text>
<path d="M74 90.000H80 M380.000 330V336" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1.5"/>
<text x="65.000" y="97.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="end">1</text>
<text x="380.000" y="366.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="middle">1</text>
<circle cx="140.000" cy="282.000" r="4" fill="var(--color-accent, #38685a)"/>
<text x="135.000" y="236.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="middle">1 event</text>
<text x="135.000" y="260.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="middle">5 cases</text>
<rect x="226.000" y="206.000" width="8" height="8" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1.6"/>
<text x="225.000" y="155.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="middle">5 events</text>
<text x="225.000" y="179.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="middle">10 cases</text>
<circle cx="320.000" cy="138.000" r="4" fill="var(--color-accent, #38685a)"/>
<text x="320.000" y="72.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="middle">4 events</text>
<text x="320.000" y="96.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="middle">5 cases</text>
<text x="230.000" y="406.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="middle">Predicted probability</text>
<text x="20.000" y="475.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="start">Mean Brier loss</text>
<text x="105.000" y="537.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="end">Varying</text>
<rect x="120" y="517" width="128.000" height="26" fill="var(--color-accent, #38685a)" stroke="var(--color-accent, #38685a)" stroke-width="1.5"/>
<text x="261.000" y="537.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="start">0.16</text>
<text x="105.000" y="607.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="end">Constant</text>
<rect x="120" y="587" width="200.000" height="26" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1.5"/>
<text x="333.000" y="607.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="start">0.25</text>
<path d="M120 500V636H370" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1.5"/>
<path d="M120.000 636V642" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1.5"/>
<text x="120.000" y="676.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="middle">0</text>
<path d="M200.000 636V642" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1.5"/>
<text x="200.000" y="676.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="middle">0.1</text>
<path d="M280.000 636V642" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1.5"/>
<text x="280.000" y="676.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="middle">0.2</text>
<path d="M360.000 636V642" fill="none" stroke="var(--color-ink, #292c29)" stroke-width="1.5"/>
<text x="360.000" y="676.000" fill="var(--color-ink, #292c29)" font-family="var(--world-type-numeric-family, sans-serif)" font-size="20" text-anchor="middle">0.3</text>
</svg>
