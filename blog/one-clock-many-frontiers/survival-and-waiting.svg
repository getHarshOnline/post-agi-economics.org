<text x="60.000" y="112.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="start">10%, then 50%</text>
<text x="60.000" y="140.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="start">Mean wait: 2.8 periods</text>
<text x="20.000" y="200.000" fill="var(--color-ink, #292c29)" font-family="var(--type-family-reading, sans-serif)" font-size="20" text-anchor="start">Probability of still waiting</text>
