<svg xmlns="http://www.w3.org/2000/svg" width="420" height="840" viewBox="0 0 420 840" role="img" aria-labelledby="plot-title plot-desc">
<title id="plot-title">Two waiting-time distributions</title><desc id="plot-desc">Both crossing laws begin at ten percent. Keeping ten percent each period gives mean wait ten periods; changing to fifty percent after the first gives 2.8. Upper panel is survival; lower panel is first-crossing probability.</desc>
