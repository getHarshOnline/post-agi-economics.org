n-content=\"content:post-agi-transition-dynamics\" data-gazette-destination-site=\"site:post-agi-economics\" data-gazette-destination-theme=\"theme:folio\"\u003eworked comparisons\u003c/a\u003e show when to recalculate within a model and when to retain something it previously left out.\u003c/p\u003e\n"},"name":"When does the economic model need to change?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"\u003cp\u003eProducing more does not determine who receives the gain. Prices, wages, ownership claims and public arrangements connect a production improvement to the resources of particular households. Those channels also affect demand and the next production decision.\u003c/p\u003e\n"},"name":"Why follow ownership and income alongside productivity?"},{"@type":"Question","acceptedAnswer":{"@type":"Answer","text":"\u003cp\u003eOne Yardstick begins with a fair comparison of human and agent execution on a defined task, then asks what recurring economic use would require. The wider programme follows adoption, moving constraints and distribution across many such changes. One Yardstick’s proposed transition clock asks how much time an economy has to adapt, and the programme’s worked examples compare what follows under stated conditions.\u003c/p\u003e\n"},"name":"How does One Yardstick fit the programme?"}]},{"@type":"ItemList","itemListElement":[{"@type":"ListItem","item":{"@id":"https://post-agi-economics.org/collections/thinking-gets-cheap/","@type":"CollectionPage","url":"https://post-agi-economics.org/collections/thinking-gets-cheap/"},"name":"What breaks when thinking gets cheap","position":1},{"@type":"ListItem","item":{"@id":"https://post-agi-economics.org/one-yardstick/#entity","@type":"CreativeWork","url":"https://post-agi-economics.org/one-yardstick/"},"name":"One Yardstick","position":2}],"numberOfItems":2}],"http://www.w3.org/ns/prov#wasGeneratedBy":{"@type":"http://www.w3.org/ns/prov#Activity","http://www.w3.org/ns/prov#used":[{"@id":"https://rawthoughts.in/gazette/"},{"@id":"https://github.com/getHarshOnline/gazette-theme-folio"}]},"identifier":"content:post-agi-economics-projects","image":[{"@type":"ImageObject","contentUrl":"https://post-agi-economics.org/assets/content/post-agi-economics/media/opening/card-light.png","description":"A woman stands still amid a crowd moving along a city street."},{"@type":"ImageObject","contentUrl":"https://post-agi-economics.org/assets/content/post-agi-economics/media/opening/card-light.png","description":"A woman stands still amid a crowd moving along a city street."}],"inLanguage":"en","name":"Research","potentialAction":[{"@type":"ViewAction","target":"https://causality.in/"},{"@type":"ViewAction","target":"https://rawthoughts.in/products/"},{"@type":"ViewAction","target":"https://rawthoughts.in/services/"}],"publisher":{"@id":"https://rawthoughts.in/#organization","@type":"Organization","identifier":"organization:rtepl","name":"RawThoughts Enterprises Private Limited","sameAs":[{"@id":"https://github.com/getHarshOnline"}],"url":"https://rawthoughts.in/"},"text":"A woman stands still amid a crowd moving along a city street.\nWhat breaks when thinking gets cheap\nIf cognitive work becomes abundant, what happens to the limits around it? Begin with that question, then follow what an economic model must retain as production and the people making decisions change.\nA woman stands still amid a crowd moving along a city street.\nOne Yardstick\nJudge human and machine work against the same task. Then ask what else would have to change for repeated use to affect production and household purchasing power.\nFurther questions\nWhen the model must change\nNew decision makers and relationships can ask more of an economic model than a new estimate within it. Causality studies how descriptions can change while keeping account of the distinctions that matter.\nExplore the formal inquiry\nCapability in working life\nA capability matters economically when people can use it in recurring work. RawThoughts explores the systems around that use: goals, context, relationships and the responsibility for a result.\nExplore the systems\nQuestions about the research\nWhat does this research ask?\nPost-AGI Economics asks what changes in an economy, and in the models that describe it, when cognitive work gets cheap. The main line of inquiry follows production, scarcity and who receives the gain.\nDoes this inquiry depend on predicting one AGI date?\nNo. Capability, affordable access, reliable operation and institutional change move at different speeds. The inquiry follows particular frontiers and the ways they affect one another. A machine does not need to cross one universal threshold for its economic consequences to matter.\nWhen does the economic model need to change?\nA model that represents plans and machine time can still work when machinery becomes the limit. New decision makers, ownership arrangements or relationships may require a different account. The question is which consequence the model must preserve. The worked comparisons show when to recalculate within a model and when to retain something it previously left out.\nWhy follow ownership and income alongside productivity?\nProducing more does not determine who receives the gain. Prices, wages, ownership claims and public arrangements connect a production improvement to the resources of particular households. Those channels also affect demand and the next production decision.\nHow does One Yardstick fit the programme?\nOne Yardstick begins with a fair comparison of human and agent execution on a defined task, then asks what recurring economic use would require. The wider programme follows adoption, moving constraints and distribution across many such changes. One Yardstick’s proposed transition clock asks how much time an economy has to adapt, and the programme’s worked examples compare what follows under stated conditions.\n","url":"https://post-agi-economics.org/research/","usageInfo":{"@id":"https://post-agi-economics.org/terms/"}}</script>
